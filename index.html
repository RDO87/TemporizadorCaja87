<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Temporizador — Pantalla</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a0a; }
body { font-family: monospace; color: #fff; position: relative; }
#slide-bg { position: fixed; inset: 0; background-size: cover; background-position: center; transition: opacity 0.6s; z-index: 0; }
#overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.52); z-index: 1; }
#timer-display { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); z-index: 10; text-align: center; pointer-events: none; }
#time-text { font-size: clamp(5rem, 20vw, 14rem); font-weight: 700; letter-spacing: 0.05em; text-shadow: 0 0 80px rgba(0,0,0,0.9); transition: color 0.4s; font-variant-numeric: tabular-nums; }
#time-text.warning { color: #f97316; }
#time-text.danger { color: #ef4444; }
#slide-counter { font-size: 1.1rem; letter-spacing: 0.25em; opacity: 0.5; margin-top: 1rem; }
#status { position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%); font-size: 0.7rem; letter-spacing: 0.2em; opacity: 0.3; z-index: 20; }
#mode-badge { position: fixed; top: 1rem; left: 1rem; z-index: 30; font-size: 0.7rem; letter-spacing: 0.15em; padding: 0.35rem 0.75rem; border-radius: 4px; border: 1px solid rgba(255,255,255,0.15); background: rgba(0,0,0,0.5); }
</style>
</head>
<body>

<div id="slide-bg"></div>
<div id="overlay"></div>
<div id="mode-badge">CUENTA REGRESIVA</div>

<div id="timer-display">
  <div id="time-text">--:--</div>
  <div id="slide-counter">ESPERANDO CONEXIÓN...</div>
</div>

<div id="status">CONECTANDO...</div>

<!-- ✅ REEMPLAZA ESTE BLOQUE CON TU firebaseConfig -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBORR1E4boTpovc7is4d-qNCf9CAx8s1RI",
    authDomain: "caja87-6e5d9.firebaseapp.com",
    databaseURL: "https://caja87-6e5d9-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "caja87-6e5d9",
    storageBucket: "caja87-6e5d9.firebasestorage.app",
    messagingSenderId: "955964235169",
    appId: "1:955964235169:web:a08564071ddae65bffe0"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const bg = document.getElementById('slide-bg');
  const timeText = document.getElementById('time-text');
  const slideCounter = document.getElementById('slide-counter');
  const modeBadge = document.getElementById('mode-badge');
  const status = document.getElementById('status');

  function pad(n) { return String(n).padStart(2,'0'); }
  function fmt(s) {
    const a = Math.abs(s);
    return (s < 0 ? '-' : '') + pad(Math.floor(a / 60)) + ':' + pad(a % 60);
  }

  onValue(ref(db, 'timer'), snapshot => {
    const d = snapshot.val();
    if (!d) return;

    status.textContent = 'SINCRONIZADO ●';
    status.style.opacity = '0.4';

    // Tiempo mostrado
    const shown = d.countdown ? d.totalSeconds - d.elapsed : d.elapsed;
    timeText.textContent = fmt(shown);

    // Colores
    timeText.classList.remove('warning','danger');
    if (d.countdown) {
      const r = d.elapsed / d.totalSeconds;
      if (r > 0.9) timeText.classList.add('danger');
      else if (r > 0.75) timeText.classList.add('warning');
    }

    // Modo
    modeBadge.textContent = d.countdown ? 'CUENTA REGRESIVA' : 'CUENTA PROGRESIVA';

    // Diapositiva
    if (d.imageData) {
      bg.style.backgroundImage = 'url(' + d.imageData + ')';
      slideCounter.textContent = 'DIAPOSITIVA ' + (d.currentSlide + 1) + ' / ' + d.totalSlides;
    } else {
      slideCounter.textContent = 'SIN IMÁGENES';
    }
  });
</script>
</body>
</html>
